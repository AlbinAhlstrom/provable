# Provable Domain Knowledge Graph Ontology
# Modeled following Stage 3 of graph-engineering skill (Southeast University Curriculum)

version: "1.0.0"
namespace: "provable.domain"

competency_questions:
  - "Can a presentation router import db.store or SQLAlchemy models directly? (Answer: No, MUST access aggregates through Unit of Work)."
  - "Are domain model entities permitted to have FastAPI, Pydantic, or database dependencies? (Answer: No, pure @dataclass only)."
  - "Can the Provable Engine directly mutate files in workspace/ during runtime preview? (Answer: No, total isolation between :8000 and :8001)."
  - "Which component manages transaction boundaries and event dispatch? (Answer: AbstractUnitOfWork)."
  - "How are frontend components generated from domain concepts? (Answer: Dynamic schema projection via @rjsf/mui, zero hardcoded domain keywords)."

entities:
  ProvableEngine:
    desc: "The core AppGen and orchestration backend (:8000 API, :5173 UI)."
    examples: ["backend/app.py", "backend/main.py"]

  WorkspaceApp:
    desc: "The sandboxed generated client application (:8001 API, :5174 Preview)."
    examples: ["workspace/backend", "workspace/frontend"]

  AggregateRoot:
    desc: "Domain cluster boundary maintaining transactional invariants."
    examples: ["Requirement", "Component", "Project"]

  DomainEntity:
    desc: "Individual entity possessing a distinct identity within an aggregate."
    examples: ["EntityAttributeSpec", "FieldSpec"]

  ValueObject:
    desc: "Immutable object defined entirely by its structural attributes with no lifecycle."
    examples: ["CanonicalKey", "StatusTransition"]

  DomainEvent:
    desc: "Immutable record of a significant domain occurrence emitted by an aggregate."
    examples: ["RequirementCreated", "ComponentUpdated"]

  Invariant:
    desc: "Strict business rule or system boundary that must never be violated."
    examples: ["NonDefaultArgsPrecedeDefault", "MetaIsolation8000Vs8001", "ZeroORMInDomain"]

  UnitOfWork:
    desc: "Atomic transaction manager coordinating repositories and event dispatch."
    examples: ["SqliteUnitOfWork", "AbstractUnitOfWork"]

  Repository:
    desc: "Persistence abstraction for collecting and querying aggregate roots."
    examples: ["SqliteRequirementRepository", "SqliteComponentRepository"]

  FastAPIRouter:
    desc: "HTTP entrypoint translating requests into service layer / UoW actions."
    examples: ["backend/entrypoints/routers/requirements.py", "backend/entrypoints/routers/components.py"]

relations:
  MAINTAINS_INVARIANT:
    domain: AggregateRoot
    range: Invariant
    desc: "Aggregate encapsulates and enforces this invariant."

  EMITS_EVENT:
    domain: AggregateRoot
    range: DomainEvent
    desc: "Aggregate publishes this event upon state transition."

  PERSISTED_BY:
    domain: AggregateRoot
    range: Repository
    desc: "Repository loads and stores instances of this aggregate."

  COORDINATED_BY:
    domain: Repository
    range: UnitOfWork
    desc: "Unit of Work manages repository instances under a single atomic transaction."

  INVOKES_UOW:
    domain: FastAPIRouter
    range: UnitOfWork
    desc: "Router delegates domain operations to Unit of Work."

  ISOLATED_FROM:
    domain: ProvableEngine
    range: WorkspaceApp
    desc: "Strict runtime and process boundary separating engine from generated app."

  GENERATES:
    domain: ProvableEngine
    range: WorkspaceApp
    desc: "Engine synthesizes and synchronizes code into the workspace."
