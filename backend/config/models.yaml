# Model configuration for Provable agent pipeline
# Change model/base_url/api_key_env here to swap LLMs without touching Python code.

default:
  model: gemini-3.8-flash
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: LLM_API_KEY

stages:
