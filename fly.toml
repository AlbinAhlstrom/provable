# Provable engine. Rename `app` to a unique name before `fly deploy`.
app = "provable-engine"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PROVABLE_WORKSPACE = "/data/ws-root"

[mounts]
  source = "provable_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 5174
  [[services.ports]]
    port = 5174
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
