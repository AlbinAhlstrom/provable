# fly.toml app configuration file generated for provable-dr4ioa on 2026-10-12T06:27:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# The engine keeps generated apps and state on the machine's disk, so the machine must not
# be stopped when idle. For state that survives deploys, create a volume
# (`fly volumes create provable_data --size 3`) and add a [mounts] block
# (source = 'provable_data', destination = '/data').

app = 'provable-dr4ioa'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# The generated app's preview server.
[[services]]
  protocol = 'tcp'
  internal_port = 5174
  processes = ['app']

  [[services.ports]]
    port = 5174
    handlers = ['tls', 'http']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
