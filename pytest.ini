[pytest]
testpaths = backend/tests
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: Unit tests for isolated modules and components
    api: API endpoint tests for FastAPI endpoints
    integration: Integration tests between DataStore, StrictDoc, and Allure
    system: System workflow tests for agent orchestrators and pipelines
    e2e: End-to-end launcher and setup tests
    slow: Tests that take seconds each (headless browser, Vite builds, full inbox runs); the commit hook and pre-flight run them, `-m "not slow"` skips them while iterating
    llm: Opt-in tests that call a real LLM provider (need RUN_LLM_SMOKE=1 and an API key)
    boss_fight: High-stress acceptance tests (OCC, DDD invariants, LLM judge)
    real_workspace_resolution: Tests of config_loader's workspace resolution; opt out of the per-test workspace patch
